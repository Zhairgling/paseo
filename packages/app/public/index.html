<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#15100B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Paseo Atelier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="atelier-fonts">
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: swap;
        src: url(/fonts/Archivo-normal-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: swap;
        src: url(/fonts/Archivo-normal-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Archivo";
        font-style: italic;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: swap;
        src: url(/fonts/Archivo-italic-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/JetBrainsMono-normal-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/JetBrainsMono-normal-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Keep the app shell fixed to the viewport. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles smooth text rendering in the app shell. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent white flash before React mounts (Atelier dark default) */
      html,
      body {
        background-color: #15100b;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
    <style>
      button,
      a,
      input,
      textarea,
      select,
      [role="button"],
      [role="link"],
      [role="textbox"],
      [role="combobox"],
      [role="tab"],
      [role="switch"],
      [role="checkbox"],
      [role="slider"],
      [role="menuitem"],
      [tabindex],
      [data-window-no-drag],
      [contenteditable="true"] {
        -webkit-app-region: no-drag !important;
      }

      /* Electron does not clip app-region rectangles to scroll viewports.
         Content-only viewports emit no window regions, including from their
         controls. Visible controls here use normal DOM hit testing.
         Use initial: Blink parses the explicit value none as no-drag. */
      [data-window-content],
      [data-window-content] * {
        -webkit-app-region: initial !important;
      }

      /* Suppress the browser's default focus outline — it appears on mouse
         clicks and looks out of place against our themed surfaces. Keep a
         themed ring for keyboard users via :focus-visible. The ring is the active
         theme's `ring` color, exposed by Unistyles as a CSS variable; the fallback
         only shows before the theme mounts. */
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid var(--colors-ring, #f0a050);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
